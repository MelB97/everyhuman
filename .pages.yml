# Settings for the website editor (Pages CMS). Each entry below is a section in the editor.
media:
  - name: images
    label: Photos
    input: src/images/uploads
    output: /images/uploads
    rename: safe
    categories: [image]
  - name: videos
    label: Videos
    input: src/videos
    output: /videos
    rename: safe
    categories: [video, image, document]

content:
  # ── Our team ── one entry per person. Add, edit or delete people here.
  - name: team
    label: "Our team"
    type: collection
    path: src/team
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: name
      fields: [name, title, based, show]
      sort: [name]
    fields:
      - name: name
        label: "Name (as it should appear)"
        type: string
        required: true
        description: "First name and last initial is fine, e.g. Sarah M."
      - name: title
        label: "Job title"
        type: select
        required: true
        default: "Support Worker"
        options:
          values: ["CEO", "Operations Manager", "Manager NSW", "Manager QLD", "Admin", "Team Leader", "Senior Support Worker", "Support Worker"]
      - name: team
        label: "Which group are they shown in?"
        type: select
        required: true
        default: "Support team"
        options:
          values: ["Support team", "Office team"]
      - name: based
        label: "Based in"
        type: select
        required: true
        options:
          values: ["Illawarra, NSW", "South Coast, NSW", "Logan, QLD", "Gold Coast, QLD"]
      - name: all_locations
        label: "Covers all locations"
        type: boolean
        default: false
        description: "Tick for people who work across every location, e.g. managers."
      - name: order
        label: "Order (optional)"
        type: number
        description: "Lower numbers show first. Leave empty to sort by name."
      - name: photo
        label: "Photo (optional)"
        type: image
        options: { media: images }
        description: "A clear, friendly photo of their face. If you leave this empty, their initials are shown instead."
      - name: bio
        label: "A little about them (optional)"
        type: text
        description: "One or two sentences, e.g. Loves the beach, footy and a good cuppa."
      - name: show
        label: "Show on the website"
        type: boolean
        default: true
        description: "Untick to hide someone without deleting them."

  # ── Business details ──
  - name: site
    label: "Business details"
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: business_name, label: "Business name", type: string, required: true }
      - { name: short_name, label: "Short name", type: string }
      - { name: legal_name, label: "Legal name (shown in the footer, optional)", type: string }
      - { name: abn, label: ABN, type: string }
      - { name: tagline, label: "Slogan", type: string }
      - { name: phone, label: "Phone number", type: string, required: true }
      - { name: phone_note, label: "Line under the phone number", type: string }
      - { name: email, label: "Main email (general enquiries)", type: string, required: true }
      - { name: accounts_email, label: "Accounts email", type: string }
      - { name: hours, label: "Office hours (optional)", type: string }
      - { name: facebook, label: "Facebook page link (optional)", type: string }
      - { name: logo, label: "Logo (a PNG with a clear background works best)", type: image, options: { media: images } }
      - { name: ndis_badge, label: "NDIS badge", type: image, options: { media: images } }
      - { name: referral_form_script, label: "Astalty referral form link (the src from the embed code)", type: string }
      - { name: response_time, label: "Message after a form is sent", type: string }
      - { name: clothing_note, label: "Note for people looking for the clothing company", type: text }
      - { name: clothing_link, label: "Clothing company's website", type: string }

  # ── Homepage ──
  - name: home
    label: "Homepage"
    type: file
    path: src/_data/home.json
    format: json
    fields:
      - { name: seo_title, label: "Google title", type: string, description: "Shown as the blue link in Google. Aim for under 60 characters." }
      - { name: seo_description, label: "Google description", type: text, description: "Shown under the link in Google. Aim for 150–160 characters." }
      - { name: kicker, label: "Small line above the heading", type: string }
      - { name: h1, label: "Main heading", type: string }
      - { name: h1_highlight, label: "Highlighted word at the end of the heading", type: string }
      - { name: intro, label: "Intro text", type: text }
      - name: hero_photos
        label: "Top photos (the honeycomb, first one is the big centre photo, up to 5)"
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, options: { media: images } }
          - { name: alt, label: "Describe the photo (read aloud to blind visitors)", type: string, required: true, description: "One short sentence about who is in it and what they are doing, e.g. A support worker and client feeding an alpaca. Do not use names unless they have agreed." }
      - name: paths
        label: "The three 'I'm…' boxes"
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: button, label: "Link text", type: string }
          - { name: link, label: "Link to", type: string }
      - { name: services_heading, label: "Services heading", type: string }
      - { name: services_intro, label: "Services intro", type: text }
      - { name: stories_heading, label: "Video stories heading", type: string }
      - { name: stories_intro, label: "Video stories intro", type: text }
      - name: stories
        label: "Video stories"
        type: object
        list: true
        fields:
          - { name: name, label: "Title, e.g. Meet Brandon", type: string }
          - { name: label, label: "Their role, e.g. Client, Support worker or Management", type: string }
          - { name: video, label: "Video (MP4, keep it under about 20 MB)", type: file, options: { media: videos } }
          - { name: poster, label: "Cover image (shown before it plays)", type: image, options: { media: videos } }
          - { name: description, label: "Describe the video (read aloud to blind visitors)", type: text, required: true, description: "One or two sentences about who is in it and what happens." }
          - { name: captions, label: "Captions file (.vtt, optional but recommended)", type: file, options: { media: videos }, description: "Captions let deaf and hard of hearing visitors follow along." }
          - { name: transcript, label: "Transcript (optional)", type: text, description: "What is said in the video, typed out. Shown under the video for anyone who prefers to read." }
      - { name: steps_heading, label: "Getting started heading", type: string }
      - name: steps
        label: "Getting started steps"
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - { name: funding_heading, label: "Funding heading", type: string }
      - name: funding
        label: "Funding options"
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - { name: values_heading, label: "Why choose us heading", type: string }
      - name: values
        label: "Why choose us points"
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - { name: locations_heading, label: "Locations heading", type: string }
      - { name: locations_intro, label: "Locations intro", type: text }
      - { name: moments_heading, label: "Everyday moments heading", type: string }
      - { name: moments_intro, label: "Everyday moments intro", type: text }
      - name: moments
        label: "Everyday moments photos"
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, options: { media: images } }
          - { name: alt, label: "Describe the photo (read aloud to blind visitors)", type: string, required: true, description: "One short sentence about who is in it and what they are doing, e.g. A support worker and client feeding an alpaca. Do not use names unless they have agreed." }
      - { name: team_heading, label: "Team heading", type: string }
      - { name: team_intro, label: "Team intro", type: text }
      - { name: cta_heading, label: "Bottom banner heading", type: string }
      - { name: cta_text, label: "Bottom banner text", type: text }

  # ── About us page ──
  - name: about
    label: "About us page"
    type: file
    path: src/_data/about.json
    format: json
    fields:
      - { name: seo_title, label: "Google title", type: string }
      - { name: seo_description, label: "Google description", type: text }
      - { name: h1, label: "Page heading", type: string }
      - { name: intro, label: Intro, type: text }
      - { name: story_heading, label: "Story heading", type: string }
      - { name: story_text, label: Story, type: text }
      - { name: photo, label: "Photo beside the story", type: image, options: { media: images } }
      - { name: photo_alt, label: "Describe the photo (read aloud to blind visitors)", type: string, required: true, description: "One short sentence about who is in it and what they are doing, e.g. A support worker and client feeding an alpaca." }
      - { name: video, label: "Video", type: file, options: { media: videos } }
      - { name: video_poster, label: "Video cover image", type: image, options: { media: videos } }
      - { name: video_description, label: "Describe the video (read aloud to blind visitors)", type: text }
      - { name: child_safe, label: "Child safe statement", type: text }
      - { name: office_heading, label: "Office team heading", type: string }
      - { name: office_intro, label: "Office team intro", type: text }
      - { name: support_heading, label: "Support team heading", type: string }
      - { name: support_intro, label: "Support team intro", type: text }

  # ── Photos on other pages ──
  - name: photos
    label: "Photos on other pages"
    type: file
    path: src/_data/photos.json
    format: json
    fields:
      - name: careers
        label: "Careers page"
        type: object
        fields:
          - { name: image, label: Photo, type: image, options: { media: images } }
          - { name: alt, label: "Describe the photo (read aloud to blind visitors)", type: string, required: true, description: "One short sentence about who is in it and what they are doing, e.g. A support worker and client feeding an alpaca." }
      - name: referrals
        label: "Referrals page"
        type: object
        fields:
          - { name: image, label: Photo, type: image, options: { media: images } }
          - { name: alt, label: "Describe the photo (read aloud to blind visitors)", type: string, required: true, description: "One short sentence about who is in it and what they are doing, e.g. A support worker and client feeding an alpaca." }
      - name: contact
        label: "Contact page"
        type: object
        fields:
          - { name: image, label: Photo, type: image, options: { media: images } }
          - { name: alt, label: "Describe the photo (read aloud to blind visitors)", type: string, required: true, description: "One short sentence about who is in it and what they are doing, e.g. A support worker and client feeding an alpaca." }

  # ── Services ──
  - name: services
    label: "Services"
    type: collection
    path: src/services
    format: yaml-frontmatter
    view:
      primary: title
      fields: [title, order]
      sort: [order]
    fields:
      - { name: title, label: "Page heading", type: string, required: true }
      - { name: nav_title, label: "Short name (menus)", type: string, required: true }
      - { name: order, label: "Order in lists", type: number }
      - name: icon
        label: Icon
        type: select
        options:
          values: [personal, community, skills, home, transport, transitions, aged]
      - { name: summary, label: "Short summary (used in lists)", type: text }
      - { name: lead, label: "Intro under the heading", type: text }
      - { name: image, label: "Photo", type: image, options: { media: images } }
      - { name: image_alt, label: "Describe the photo (read aloud to blind visitors)", type: string, required: true, description: "One short sentence about who is in it and what they are doing, e.g. A support worker and client feeding an alpaca." }
      - { name: seo_title, label: "Google title", type: string }
      - { name: seo_description, label: "Google description", type: text }
      - { name: body, label: "Page content", type: rich-text }

  # ── Locations ──
  - name: locations
    label: "Locations"
    type: collection
    path: src/locations
    format: yaml-frontmatter
    view:
      primary: title
      fields: [title, state]
      sort: [order]
    fields:
      - { name: title, label: "Town or area (page heading)", type: string, required: true }
      - { name: short_title, label: "Short name (used in the list under the top heading)", type: string }
      - { name: state, label: State, type: select, options: { values: [QLD, NSW] } }
      - { name: region, label: Region, type: string }
      - { name: order, label: "Order in lists", type: number }
      - { name: team_location, label: "Team location label (must match the team list)", type: string }
      - { name: area, label: "Area we cover", type: string }
      - { name: image, label: "Photo", type: image, options: { media: images } }
      - { name: image_alt, label: "Describe the photo (read aloud to blind visitors)", type: string, required: true, description: "One short sentence about who is in it and what they are doing, e.g. A support worker and client feeding an alpaca." }
      - { name: summary, label: "Short summary (used in lists)", type: text }
      - { name: lead, label: "Intro under the heading", type: text }
      - { name: seo_title, label: "Google title", type: string }
      - { name: seo_description, label: "Google description", type: text }
      - { name: body, label: "Page content", type: rich-text }
